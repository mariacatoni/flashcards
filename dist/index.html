<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A focused HSK 3.0 flashcard study tool for simplified Chinese."
    />
    <meta name="theme-color" content="#f5f5f1" />
    <title>Chinese Flashcards</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23f5f5f1'/%3E%3Crect x='5' y='5' width='54' height='54' rx='5' fill='none' stroke='%23384b55' stroke-width='4'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='serif' font-size='39' fill='%23384b55'%3E学%3C/text%3E%3C/svg%3E"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-gb-web@1.522.0/lxgwwenkaigb-regular/result.css"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="study-shell" aria-labelledby="app-title">
      <header class="study-header">
        <div>
          <p class="eyebrow" id="app-title">Chinese flashcards</p>
          <p class="source-note">HSK 3.0 · 2025 syllabus</p>
        </div>

        <div class="study-context">
          <label for="level-filter">Level</label>
          <select id="level-filter" aria-label="Choose HSK level">
            <option value="1">HSK 1</option>
            <option value="2">HSK 2</option>
            <option value="all">All</option>
          </select>
          <output id="progress" aria-live="polite">Loading…</output>
        </div>
      </header>

      <div class="study-workspace">
        <div class="card-column">
          <section class="flashcard" aria-label="Flashcard">
            <div class="card-meta" id="card-meta">
              <span class="level-badge" id="level-badge">HSK</span>
              <span class="part-of-speech" id="part-of-speech"></span>
            </div>

            <div class="card-content" id="card-content" aria-live="polite">
              <div class="hanzi" id="hanzi" lang="zh-Hans"></div>
              <div class="pinyin" id="pinyin"></div>
              <p class="translation" id="translation"></p>
            </div>

            <p class="error-message" id="error-message" role="alert" hidden></p>
            <p class="empty-message" id="empty-message" role="status" hidden></p>
          </section>

          <nav class="card-navigation" aria-label="Flashcard navigation">
            <button id="previous-card" type="button">Previous</button>
            <button id="shuffle-card" type="button">Shuffle</button>
            <button id="next-card" type="button">Next</button>
          </nav>

          <p class="keyboard-note">
            Keyboard: left/right to move · P for pinyin · E for English · S to shuffle
          </p>
        </div>

        <aside class="deck-panel" aria-label="Deck controls">
          <label for="deck-filter">Deck</label>
          <select id="deck-filter" aria-label="Choose study deck">
            <option value="later">To learn later</option>
            <option value="studying">Studying</option>
            <option value="learned">Learned</option>
          </select>

          <fieldset class="deck-assignment" id="deck-assignment">
            <legend>Move this card to</legend>
            <div class="deck-options">
              <button class="deck-button" type="button" data-deck="later">
                To learn later
              </button>
              <button class="deck-button" type="button" data-deck="studying">
                Studying
              </button>
              <button class="deck-button" type="button" data-deck="learned">
                Learned
              </button>
            </div>
          </fieldset>

          <p class="deck-status" id="deck-status" aria-live="polite"></p>

          <div class="visibility-controls" aria-label="Card visibility">
            <button class="text-toggle" id="toggle-pinyin" type="button" aria-pressed="true">
              Pinyin on
            </button>
            <button class="text-toggle" id="toggle-english" type="button" aria-pressed="true">
              English on
            </button>
          </div>
        </aside>
      </div>
    </main>
  </body>
</html>
